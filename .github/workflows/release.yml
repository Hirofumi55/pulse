name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Validate Sparkle key
        run: |
          if [[ "${{ secrets.SPARKLE_PRIVATE_KEY != '' }}" != "true" ]]; then
            echo "SPARKLE_PRIVATE_KEY is required for signed Sparkle updates." >&2
            exit 1
          fi
          PUBLIC_KEY="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' Pulse/App/Info.plist)"
          if [[ "$PUBLIC_KEY" == "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" ]]; then
            echo "Pulse/App/Info.plist still contains the placeholder Sparkle public key." >&2
            exit 1
          fi

      - name: Build
        run: |
          xcodebuild \
            -scheme Pulse \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            build

      - name: Create ZIP
        run: |
          mkdir -p build/export
          ditto -c -k --keepParent \
            build/DerivedData/Build/Products/Release/Pulse.app \
            build/export/Pulse-${{ steps.version.outputs.VERSION }}.zip

      - name: Locate Sparkle tools
        id: sparkle
        run: |
          SPARKLE_BIN="$(find build/DerivedData/SourcePackages/artifacts -path '*/Sparkle/bin' -type d -print -quit)"
          if [[ -z "$SPARKLE_BIN" ]]; then
            echo "Sparkle tools were not found." >&2
            exit 1
          fi
          echo "bin=$SPARKLE_BIN" >> "$GITHUB_OUTPUT"

      - name: Sign with Sparkle EdDSA
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          umask 077
          KEY_FILE="$(mktemp)"
          cleanup() {
            rm -f "$KEY_FILE"
          }
          trap cleanup EXIT
          printf "%s\n" "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          "${{ steps.sparkle.outputs.bin }}/sign_update" -f "$KEY_FILE" \
            build/export/Pulse-${{ steps.version.outputs.VERSION }}.zip > signature.txt

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/export/Pulse-${{ steps.version.outputs.VERSION }}.zip

      - name: Generate appcast
        run: ./scripts/generate-appcast.sh build/export/
        env:
          GENERATE_APPCAST: ${{ steps.sparkle.outputs.bin }}/generate_appcast
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Deploy appcast to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: true

      - name: Update Homebrew Cask
        if: ${{ secrets.TAP_REPO_TOKEN != '' }}
        run: ./scripts/update-cask.sh ${{ steps.version.outputs.VERSION }}
        env:
          GH_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
