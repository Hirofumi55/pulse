name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          xcodebuild \
            -scheme Pulse \
            -configuration Release \
            -archivePath build/Pulse.xcarchive \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath build/Pulse.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Create ZIP
        run: |
          cd build/export
          ditto -c -k --keepParent Pulse.app Pulse-${{ steps.version.outputs.VERSION }}.zip

      - name: Sign with Sparkle EdDSA
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_key
          sign_update -f /tmp/sparkle_key build/export/Pulse-${{ steps.version.outputs.VERSION }}.zip > signature.txt
          rm /tmp/sparkle_key

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/export/Pulse-${{ steps.version.outputs.VERSION }}.zip

      - name: Generate appcast
        run: ./scripts/generate-appcast.sh build/export/

      - name: Deploy appcast to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: true

      - name: Update Homebrew Cask
        run: ./scripts/update-cask.sh ${{ steps.version.outputs.VERSION }}
        env:
          GH_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
